<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Freelancer Hub</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">💼 Freelancer Hub</div>
        <div class="auth-subtitle">Sign in to your account</div>

        <div id="error-msg" class="alert alert-error" style="display:none"></div>

        <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-input"
                   placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-input"
                   placeholder="Your password" autocomplete="current-password">
        </div>

        <button class="btn btn-primary btn-full" onclick="handleLogin()">
            Sign in
        </button>

        <p style="text-align:center; margin-top:1rem; font-size:13px; color:var(--text-hint)">
            No account?
            <a href="/register">Create one</a>
        </p>
    </div>
</div>

<script>
    // If already logged in, go to dashboard
    if (localStorage.getItem('access_token')) {
        window.location.href = '/dashboard';
    }

    async function handleLogin() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl  = document.getElementById('error-msg');

        if (!email || !password) {
            errorEl.textContent = 'Please fill in all fields.';
            errorEl.style.display = 'block';
            return;
        }

        // OAuth2 login requires form-encoded data, not JSON
        const formData = new FormData();
        formData.append('username', email);
        formData.append('password', password);

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const data = await res.json();
                errorEl.textContent = data.detail || 'Login failed.';
                errorEl.style.display = 'block';
                return;
            }

            const data = await res.json();
            // Store token in localStorage — every API call will use this
            localStorage.setItem('access_token', data.access_token);
            window.location.href = '/dashboard';

        } catch (e) {
            errorEl.textContent = 'Connection error. Please try again.';
            errorEl.style.display = 'block';
        }
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
